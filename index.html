}

// Eisenhower Matrix
function renderMatrix(all) {
  const notDone = all.filter(t => t.status !== 'done');
  const q1 = notDone.filter(t => t.matrix === 'q1');
  const q2 = notDone.filter(t => t.matrix === 'q2');
  const q3 = notDone.filter(t => t.matrix === 'q3');
  const q4 = notDone.filter(t => t.matrix === 'q4');
  const unassigned = notDone.filter(t => !t.matrix);

  function mItems(items) {
    return items.length ? items.map(t => `<div class="matrix-item"><div class="chk ${t.status==='done'?'on':''}" style="width:14px;height:14px;border-radius:3px" onclick="toggleTaskStatus('${t.id}')"></div><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.title}</span></div>`).join('') : `<div style="font-size:10px;color:var(--tx4);padding:4px">—</div>`;
  }

  return `
    <div class="matrix">
      <div class="matrix-q mq1"><div class="matrix-q-t">🔴 ${T('task_pri_urgent_imp')}</div>${mItems(q1)}</div>
      <div class="matrix-q mq2"><div class="matrix-q-t">🟡 ${T('task_pri_not_urgent_imp')}</div>${mItems(q2)}</div>
      <div class="matrix-q mq3"><div class="matrix-q-t">🔵 ${T('task_pri_urgent_not_imp')}</div>${mItems(q3)}</div>
      <div class="matrix-q mq4"><div class="matrix-q-t">⚪ ${T('task_pri_not_urgent_not_imp')}</div>${mItems(q4)}</div>
    </div>
    ${unassigned.length?`<div class="card" style="margin-top:12px"><div class="card-t">📋 ${pref.lang==='id'?'Belum Dikategorikan':'Uncategorized'} (${unassigned.length})</div>${unassigned.map(t=>renderTaskItem(t)).join('')}</div>`:''}
  `;
}

      <div><div class="pg-title">📅 ${T('calendar_title')}</div><div class="pg-sub">${pref.lang==='id'?'Lihat agenda dan jadwal':'View your agenda and schedule'}</div></div>
      <button class="btn btn-p btn-sm" onclick="openTaskModal()">+ ${T('task_add')}</button>
    </div>

    <div class="cal-modes">
      <button class="cal-mode ${calMode==='daily'?'active':''}" onclick="calMode='daily';render()">📋 ${T('cal_daily')}</button>
      <button class="cal-mode ${calMode==='weekly'?'active':''}" onclick="calMode='weekly';render()">📅 ${T('cal_weekly')}</button>
      <button class="cal-mode ${calMode==='monthly'?'active':''}" onclick="calMode='monthly';render()">🗓️ ${T('cal_monthly')}</button>
    </div>

    <div class="mnav">
      <button class="mnav-btn" onclick="calNav(-1)">${ICONS.left}</button>
      <div class="mnav-t">${calMode==='daily'?`${calDay} ${(pref.lang==='id'?MONTHS_ID:MONTHS)[calMonth]} ${calYear}`:`${(pref.lang==='id'?MONTHS_ID:MONTHS)[calMonth]} ${calYear}`}</div>
      <button class="mnav-btn" onclick="calNav(1)">${ICONS.right}</button>
    </div>

    ${calMode==='monthly'?renderCalMonthly():calMode==='weekly'?renderCalWeekly():renderCalDaily()}
  </div>`;
}

function calNav(dir) {
  if (calMode === 'daily') {
    const d = new Date(calYear, calMonth, calDay + dir);
    calDay = d.getDate(); calMonth = d.getMonth(); calYear = d.getFullYear();
  } else if (calMode === 'weekly') {
    const d = new Date(calYear, calMonth, calDay + dir * 7);
    calDay = d.getDate(); calMonth = d.getMonth(); calYear = d.getFullYear();
  } else {
    calMonth += dir;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0) { calMonth = 11; calYear--; }
  }
  render();
}

// Monthly Calendar
function renderCalMonthly() {
  const days = daysInMonth(calYear, calMonth);
  const firstDow = new Date(calYear, calMonth, 1).getDay();
  const td = today();
  const dayNames = pref.lang==='id' ? DAYS_S_ID : DAYS_S;
  const cells = [];

  // Previous month padding
  const prevDays = daysInMonth(calYear, calMonth - 1);
  for (let i = firstDow - 1; i >= 0; i--) cells.push({ num: prevDays - i, other: true, date: '' });
  // Current month
  for (let i = 1; i <= days; i++) {
    const ds = `${calYear}-${pad(calMonth+1)}-${pad(i)}`;
    const evts = (data.tasks||[]).filter(t => t.dueDate === ds);
    cells.push({ num: i, other: false, date: ds, isToday: ds === td, evts });
  }
  // Next month padding
  const rem = 7 - (cells.length % 7); if (rem < 7) for (let i = 1; i <= rem; i++) cells.push({ num: i, other: true, date: '' });

  return `<div class="cal-grid">
    ${dayNames.map(d => `<div class="cal-head">${d}</div>`).join('')}
    ${cells.map(c => `<div class="cal-cell ${c.isToday?'cal-today':''} ${c.other?'cal-other':''}" onclick="${c.date?`calGoDaily('${c.date}')`:''}" title="${c.date?fmtDate(c.date):''}">
      <div class="cal-num">${c.num}</div>
      ${(c.evts||[]).slice(0,3).map(e => {
        const cat = data.categories.find(x=>x.id===e.category);
        const bg = cat ? cat.color+'22' : 'var(--pl)';
        const col = cat ? cat.color : 'var(--p)';
        return `<div class="cal-evt" style="background:${bg};color:${col}">${e.time?e.time+' ':''}<span>${e.title}</span></div>`;
      }).join('')}
      ${(c.evts||[]).length>3?`<div style="font-size:8px;color:var(--tx4)">+${c.evts.length-3}</div>`:''}
    </div>`).join('')}
  </div>`;
}

function calGoDaily(dateStr) {
  const d = new Date(dateStr);
  calDay = d.getDate(); calMonth = d.getMonth(); calYear = d.getFullYear();
  calMode = 'daily'; render();
}

// Weekly Calendar
function renderCalWeekly() {
  const d = new Date(calYear, calMonth, calDay);
  const dow = d.getDay();
  const weekStart = new Date(d); weekStart.setDate(d.getDate() - dow);
  const dayNames = pref.lang==='id' ? DAYS_S_ID : DAYS_S;
  const td = today();
  const hours = [];
  for (let h = 6; h <= 22; h++) hours.push(`${pad(h)}:00`);

  const weekDays = [];
  for (let i = 0; i < 7; i++) {
    const wd = new Date(weekStart); wd.setDate(weekStart.getDate() + i);
    const ds = `${wd.getFullYear()}-${pad(wd.getMonth()+1)}-${pad(wd.getDate())}`;
    weekDays.push({ ds, num: wd.getDate(), isToday: ds === td, dow: i });
  }

  return `<div class="card" style="padding:8px;overflow-x:auto">
    <div class="cal-week">
      <div class="cal-week-head"></div>
      ${weekDays.map(wd => `<div class="cal-week-head" style="${wd.isToday?'background:var(--g5);color:var(--g)':''}">${dayNames[wd.dow]}<br>${wd.num}</div>`).join('')}
      ${hours.map(h => `
        <div class="cal-hour-t" style="border-bottom:1px solid var(--bg3);padding:4px 4px;font-size:9px;color:var(--tx4)">${h}</div>
        ${weekDays.map(wd => {
          const evts = (data.tasks||[]).filter(t => t.dueDate === wd.ds && t.time && t.time.startsWith(h.split(':')[0]));
          return `<div class="cal-week-cell" style="${wd.isToday?'background:var(--g5)':''}">
            ${evts.map(e => `<div style="font-size:8px;padding:1px 3px;border-radius:2px;background:var(--pl);color:var(--p);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.title}</div>`).join('')}
          </div>`;
        }).join('')}
      `).join('')}
    </div>
  </div>`;
}

// Daily Calendar
function renderCalDaily() {
  const ds = `${calYear}-${pad(calMonth+1)}-${pad(calDay)}`;
  const evts = (data.tasks||[]).filter(t => t.dueDate === ds && t.time).sort((a,b) => a.time.localeCompare(b.time));
  const evtsNoTime = (data.tasks||[]).filter(t => t.dueDate === ds && !t.time);
  const dayName = (pref.lang==='id'?['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu']:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'])[new Date(calYear,calMonth,calDay).getDay()];
  const HOUR_H = 48;
  const START_H = 5, END_H = 23;

  const blocks = evts.map(e => {
    const [hh,mm] = (e.time||'00:00').split(':').map(Number);
    const startMin = hh * 60 + (mm||0);
    const dur = parseInt(e.duration) || 60;
    const endMin = startMin + dur;
    const cat = data.categories.find(c=>c.id===e.category);
    return { ...e, startMin, endMin, dur, cat, col: cat?cat.color:'var(--p)', bg: cat?cat.color+'20':'var(--pl)' };
  });

  const conflicts = [];
  for (let i = 0; i < blocks.length; i++) {
    for (let j = i+1; j < blocks.length; j++) {
      if (blocks[i].startMin < blocks[j].endMin && blocks[j].startMin < blocks[i].endMin) {
        conflicts.push({ a: blocks[i], b: blocks[j] });
      }
    }
  }

  blocks.forEach(b => { b.colIdx = 0; b.totalCols = 1; });
  for (let i = 0; i < blocks.length; i++) {
    const overlapping = blocks.filter((b,j) => j !== i && blocks[i].startMin < b.endMin && b.startMin < blocks[i].endMin);
    const group = [blocks[i], ...overlapping].sort((a,b) => a.startMin - b.startMin || a.title.localeCompare(b.title));
    const totalCols = Math.min(group.length, 5);
    group.forEach((b, idx) => { b.colIdx = idx % totalCols; b.totalCols = totalCols; });
  }

  const hours = [];
  for (let h = START_H; h <= END_H; h++) hours.push(h);

  return `
    <div class="card" style="margin-bottom:12px;text-align:center;padding:14px">
      <div style="font-size:16px;font-weight:700">${dayName}</div>
      <div style="font-size:13px;color:var(--tx3)">${evts.length + evtsNoTime.length} ${pref.lang==='id'?'kegiatan':'events'}</div>
    </div>
    ${conflicts.length?conflicts.map(c=>`<div class="cal-conflict"><span class="cal-conflict-icon">⚠️</span><span><strong>${pref.lang==='id'?'Bentrok Jadwal':'Schedule Conflict'}:</strong> "${c.a.title}" (${c.a.time}) ${pref.lang==='id'?'bertabrakan dengan':'overlaps with'} "${c.b.title}" (${c.b.time})</span></div>`).join(''):''}
    <div class="card" style="padding:0;overflow:hidden">
      ${hours.map(h => {
        const hStr = pad(h);
        const hourStart = h * 60;
        const hourEnd = (h+1) * 60;
        const startingHere = blocks.filter(b => b.startMin >= hourStart && b.startMin < hourEnd);
        return `<div class="cal-hour" style="height:${HOUR_H}px;min-height:${HOUR_H}px">
          <div class="cal-hour-t">${hStr}:00</div>
          <div class="cal-hour-c" style="position:relative">
            ${startingHere.map(b => {
              const topOffset = ((b.startMin - hourStart) / 60) * HOUR_H;
              const blockH = Math.max(24, (b.dur / 60) * HOUR_H);
              const colW = 100 / b.totalCols;
              const leftPct = b.colIdx * colW;
              return `<div class="cal-block" style="top:${topOffset}px;height:${blockH}px;left:${leftPct}%;width:${colW - 1}%;background:${b.bg};border-left-color:${b.col};color:${b.col}">
                <div class="cal-block-title">${b.title}</div>
                <div class="cal-block-meta">${b.time} · ${b.dur}min${b.location?' · 📍'+b.location:''}${b.pic?' · 👤'+b.pic:''}</div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
    ${evtsNoTime.length?`<div class="card" style="margin-top:12px"><div class="card-t">📋 ${pref.lang==='id'?'Tanpa Waktu':'No Time Set'}</div>${evtsNoTime.map(e=>`<div style="padding:6px 0;border-bottom:1px solid var(--bg3);font-size:13px;font-weight:600">${e.title}</div>`).join('')}</div>`:''}
    ${!evts.length&&!evtsNoTime.length?`<div class="card" style="text-align:center;padding:30px"><div class="empty-icon">📅</div><div class="empty-t">${T('cal_no_events')}</div><button class="btn btn-p btn-sm" onclick="openTaskModal(null)" style="margin-top:8px">+ ${T('task_add')}</button></div>`:''}
  `;
}

// ===== GOAL TRACKER MODULE (MODUL 5) =====
function renderGoals() {
  const goals = data.goals || [];
  const achieved = goals.filter(g => g.status === 'achieved').length;
  const gpct = goals.length ? achieved / goals.length : 0;

  // Area stats
  const areaStats = data.areas.map(a => {
    const gs = goals.filter(g => g.area === a.id);
    const ac = gs.filter(g => g.status === 'achieved').length;
    return { ...a, total: gs.length, done: ac, pct: gs.length ? ac / gs.length : 0 };
  }).filter(a => a.total > 0);

  return `<div class="page active">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
      <div><div class="pg-title">🎯 ${T('goals_title')}</div><div class="pg-sub">${achieved}/${goals.length} ${pref.lang==='id'?'tercapai':'achieved'}</div></div>
      <button class="btn btn-p" onclick="openGoalModal()">+ ${T('goal_add')}</button>
    </div>

    <!-- Summary Row -->
    <div class="g3" style="margin-bottom:14px">
      <!-- Areas -->
      <div class="card">
        <div class="card-t">🗂️ ${T('goal_areas')}</div>
        ${data.areas.map(a => {
          const s = areaStats.find(x => x.id === a.id);
          const t = s ? s.total : 0, d = s ? s.done : 0, p = s ? s.pct : 0;
          return `<div class="area-row">
            <div class="area-dot" style="background:${a.color}"></div>
            <span class="area-name">${a.emoji} ${pref.lang==='id'?(a.nameId||a.name):a.name}</span>
            <span style="color:var(--tx3);font-weight:700;font-size:11px">${d}/${t}</span>
            <div class="area-bar"><div class="pb"><div class="pf" style="width:${p*100}%;background:${a.color}"></div></div></div>
            <span style="font-weight:800;font-size:11px;width:30px;text-align:right">${Math.round(p*100)}%</span>
          </div>`;
        }).join('')}
      </div>
      <!-- Progress Ring -->
      <div class="card" style="text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px">
        <div class="card-t" style="align-self:flex-start">📊 ${T('goal_progress')}</div>
        ${ringHTML(gpct, 110, gpct >= .8 ? 'var(--grn)' : gpct >= .5 ? 'var(--ylw)' : 'var(--red)')}
        <div style="margin-top:10px;font-size:16px;font-weight:800">${achieved} / ${goals.length}</div>
        <div style="font-size:12px;color:var(--p);font-weight:600">${pref.lang==='id'?'Tetap semangat!':'Keep going!'}</div>
      </div>
      <!-- Top Priorities -->
      <div class="card">
        <div class="card-t">⭐ ${T('goal_priorities')}</div>
        ${goals.length ? goals.slice(0, 8).map((g, i) => {
          const steps = g.steps || [];
          const dn = steps.filter(s => s.done).length;
          const sp = steps.length ? dn / steps.length : 0;
          return `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;border-bottom:1px solid var(--bg3)">
            <span style="font-weight:800;color:var(--tx4)">${i+1}</span>
            <span style="flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${g.title}</span>
            ${g.status==='achieved'?`<span class="bdg bdg-g">✅</span>`:`<span class="bdg bdg-y">${Math.round(sp*100)}%</span>`}
          </div>`;
        }).join('') : `<div style="font-size:12px;color:var(--tx3);padding:8px">${T('goal_no_goals')}</div>`}
      </div>
    </div>

    <!-- Goal Cards Grid -->
    <div class="g2">
      ${goals.length ? goals.map(g => {
        const steps = g.steps || [];
        const dn = steps.filter(s => s.done).length;
        const pct = steps.length ? dn / steps.length : 0;
        const area = data.areas.find(a => a.id === g.area);
        const borderCol = area ? area.color : 'var(--p)';
        const pctCol = pct >= 1 ? 'var(--grn)' : pct >= .8 ? 'var(--ylw)' : 'var(--red)';

        return `<div class="goal-card" style="border-left-color:${borderCol}">
          <div class="goal-head">
            <div>
              <div class="goal-title">${g.title}</div>
              ${area ? `<div class="goal-area" style="color:${area.color}">${area.emoji} ${pref.lang==='id'?(area.nameId||area.name):area.name}</div>` : ''}
            </div>
            <div style="display:flex;gap:2px;flex-shrink:0">
              <button class="btn-icon" onclick="openGoalModal('${g.id}')" style="color:var(--tx3)">${ICONS.edit}</button>
              <button class="btn-icon" onclick="deleteGoal('${g.id}')" style="color:var(--red)">${ICONS.trash}</button>
            </div>
          </div>
          ${g.reward ? `<div class="goal-reward">🎁 ${g.reward}</div>` : ''}
          ${g.deadline ? `<div class="goal-deadline">📅 ${T('goal_deadline')}: ${fmtDate(g.deadline)}</div>` : ''}
          <div style="display:flex;align-items:center;gap:8px;margin:6px 0">
            ${g.status==='achieved' ? `<span class="bdg bdg-g">✅ ${T('goal_achieved')}</span>` : `<span class="bdg bdg-y">🔥 ${T('goal_in_progress')}</span>`}
            <span style="margin-left:auto;font-size:13px;font-weight:800;color:${pctCol}">${Math.round(pct*100)}%</span>
          </div>
          <div class="goal-pbar"><div class="pb"><div class="pf" style="width:${pct*100}%;background:${pctCol}"></div></div></div>
          <div class="goal-steps">
            <div style="font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;margin-bottom:4px">${T('goal_steps')}</div>
            ${steps.map((s, i) => `<div class="goal-step ${s.done?'step-done':''}">
              <div class="chk ${s.done?'on':''}" style="width:16px;height:16px;border-radius:4px" onclick="toggleGoalStep('${g.id}',${i})"></div>
              <span style="flex:1;font-weight:500">${s.text}</span>
            </div>`).join('')}
            ${!steps.length ? `<div style="font-size:11px;color:var(--tx4);padding:4px">${pref.lang==='id'?'Belum ada langkah':'No steps yet'}</div>` : ''}
          </div>
        </div>`;
      }).join('') : `<div class="card" style="grid-column:1/-1;text-align:center;padding:50px">
        <div class="empty-icon">🎯</div>
        <div class="empty-t">${T('goal_no_goals')}</div>
        <div class="empty-s">${T('goal_no_goals_sub')}</div>
        <button class="btn btn-p" onclick="openGoalModal()">+ ${T('goal_add')}</button>
      </div>`}
    </div>
  </div>`;
}

// Goal CRUD
function openGoalModal(editId) {
  const g = editId ? data.goals.find(x => x.id === editId) : null;
  const isEdit = !!g;
  const v = g || { title: '', area: '', reward: '', deadline: '', status: 'in_progress', steps: [] };
  const stepsArr = v.steps.length ? v.steps : [{ text: '', done: false }];

  modalHTML = `<div class="modal-bg" onclick="if(event.target===this){modalHTML=null;render()}"><div class="modal">
    <h2>${isEdit ? T('goal_edit') : T('goal_add')}</h2>
    <div class="mf"><label>${T('goal_title_f')} *</label><input id="gm_title" value="${v.title}"></div>
    <div class="mf"><label>${T('goal_area')}</label><select id="gm_area">
      <option value="">${pref.lang==='id'?'Pilih...':'Select...'}</option>
      ${data.areas.map(a => `<option value="${a.id}" ${v.area===a.id?'selected':''}>${a.emoji} ${pref.lang==='id'?(a.nameId||a.name):a.name}</option>`).join('')}
    </select></div>
    <div class="mf-row">
      <div class="mf"><label>${T('goal_reward')}</label><input id="gm_reward" value="${v.reward||''}" placeholder="${pref.lang==='id'?'contoh: Liburan':'e.g. Vacation'}"></div>
      <div class="mf"><label>${T('goal_deadline')}</label><input id="gm_dead" type="date" value="${v.deadline||''}"></div>
    </div>
    <div class="mf"><label>${T('goal_status')}</label><select id="gm_status">
      <option value="in_progress" ${v.status==='in_progress'?'selected':''}>🔥 ${T('goal_in_progress')}</option>
      <option value="achieved" ${v.status==='achieved'?'selected':''}>✅ ${T('goal_achieved')}</option>
    </select></div>
    <div class="mf"><label>${T('goal_steps')} (max 10)</label>
      <div id="gm_steps">${stepsArr.map((s, i) => `<div style="display:flex;gap:4px;margin-bottom:4px"><input class="gm_si" value="${s.text}" placeholder="${pref.lang==='id'?'Langkah':'Step'} ${i+1}"><button type="button" class="btn-icon" style="color:var(--red);opacity:.4;flex-shrink:0" onclick="this.parentElement.remove()">✕</button></div>`).join('')}</div>
      <button type="button" class="btn btn-s btn-sm" onclick="addGoalStepField()">+ ${T('goal_step_add')}</button>
    </div>
    <div class="modal-act">
      <button class="btn btn-s" onclick="modalHTML=null;render()">${T('confirm_no')}</button>
      <button class="btn btn-p" onclick="saveGoal('${editId||''}')">💾 ${pref.lang==='id'?'Simpan':'Save'}</button>
    </div>
  </div></div>`;
  render();
}

function addGoalStepField() {
  const c = document.getElementById('gm_steps');
  if (c.children.length >= 10) return;
  const d = document.createElement('div');
  d.style.cssText = 'display:flex;gap:4px;margin-bottom:4px';
  d.innerHTML = `<input class="gm_si" placeholder="${pref.lang==='id'?'Langkah':'Step'} ${c.children.length+1}"><button type="button" class="btn-icon" style="color:var(--red);opacity:.4;flex-shrink:0" onclick="this.parentElement.remove()">✕</button>`;
  c.appendChild(d);
}

function saveGoal(editId) {
  const title = document.getElementById('gm_title').value.trim();
  if (!title) { document.getElementById('gm_title').style.borderColor = 'var(--red)'; return; }

  const steps = [...document.querySelectorAll('.gm_si')].map(el => el.value.trim()).filter(Boolean).map(text => {
    if (editId) {
      const og = data.goals.find(g => g.id === editId);
      const os = og?.steps?.find(s => s.text === text);
      return { text, done: os ? os.done : false };
    }
    return { text, done: false };
  });

  const goal = {
    id: editId || uid(),
    title,
    area: document.getElementById('gm_area').value,
    reward: document.getElementById('gm_reward').value.trim(),
    deadline: document.getElementById('gm_dead').value,
    status: document.getElementById('gm_status').value,
    steps,
  };

  if (editId) {
    const i = data.goals.findIndex(x => x.id === editId);
    if (i >= 0) data.goals[i] = goal;
  } else {
    data.goals.push(goal);
  }
  saveData(); modalHTML = null; render();
  showSnack(pref.lang==='id'?'Target disimpan!':'Goal saved!');
}

function toggleGoalStep(gid, idx) {
  const g = data.goals.find(x => x.id === gid);
  if (g && g.steps[idx] !== undefined) {
    g.steps[idx].done = !g.steps[idx].done;
    if (g.steps.every(s => s.done)) g.status = 'achieved';
  }
  saveData(); render();
}

function deleteGoal(gid) {
  const el = document.createElement('div');
  el.className = 'cfm-bg';
  el.innerHTML = `<div class="cfm-box"><h3>⚠️ ${T('goal_delete_confirm')}</h3><p></p><div class="modal-act"><button class="btn btn-s" onclick="this.closest('.cfm-bg').remove()">${T('confirm_no')}</button><button class="btn btn-d" onclick="data.goals=data.goals.filter(g=>g.id!=='${gid}');saveData();render();this.closest('.cfm-bg').remove()">${T('confirm_yes')}</button></div></div>`;
  document.body.appendChild(el);
}

// ===== BACKUP =====
function exportBackup() {
  const exp = { data, pref: { ...pref, avatar: pref.avatar } };
  const t = new Date();
  const name = `LifeOS_Backup_${pad(t.getDate())}-${pad(t.getMonth()+1)}-${t.getFullYear()}_${pad(t.getHours())}-${pad(t.getMinutes())}.json`;
  const blob = new Blob([JSON.stringify(exp, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  showSnack(T('msg_exported'));
}

function importBackup(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imp = JSON.parse(e.target.result);
      if (imp.data) {
        localStorage.setItem(STORE_KEY, JSON.stringify(imp.data));
        if (imp.pref) localStorage.setItem(PREF_KEY, JSON.stringify(imp.pref));
      } else if (imp.habits !== undefined) {
        // Legacy v3 format compatibility
        const legacy = { ...defaultData(), habits: imp.habits || [], habitEntries: imp.he || {}, tasks: imp.tasks || [], goals: imp.goals || [] };
        if (imp.cats) legacy.categories = imp.cats;
        if (imp.areas) legacy.areas = imp.areas;
        localStorage.setItem(STORE_KEY, JSON.stringify(legacy));
      } else {
        alert('Invalid file format');
        return;
      }
      showSnack(T('msg_imported'));
      setTimeout(() => location.reload(), 1000);
    } catch { alert('Error reading file'); }
  };
  reader.readAsText(file);
}

function uploadBatch(type, file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const text=e.target.result;
    const entries=parseBatchFormat(text);
    if(!entries.length){showSnack(pref.lang==='id'?'Tidak ada data ditemukan. Periksa format ###':'No data found. Check ### format');return;}
    if(type==='hadith'){
      if(!data.customHadith)data.customHadith=[];
      entries.forEach(en=>data.customHadith.push({ar:en.ar,id:en.id,en:en.en,src:en.src}));
    } else {
      if(!data.customSahabat)data.customSahabat=[];
      entries.forEach(en=>data.customSahabat.push({text:en.en||en.id,textId:en.id||en.en,by:en.src||'Unknown'}));
    }
    saveData();render();
    showSnack(`${entries.length} ${type==='hadith'?(pref.lang==='id'?'hadis diimport!':'hadith imported!'):(pref.lang==='id'?'petuah diimport!':'wisdom imported!')}`);
  };
  reader.readAsText(file);
}

function parseBatchFormat(text){
  const blocks=text.split('###').map(b=>b.trim()).filter(Boolean);
  const entries=[];
  blocks.forEach(block=>{
    const parts=block.split('---').map(p=>p.trim());
    if(parts.length>=3){
      entries.push({
        ar:parts[0]||'',
        id:parts[1]||'',
        en:parts[2]||'',
        src:parts[3]||''
      });
    }
  });
  return entries;
}

// ===== PDF EXPORT =====
async function loadJsPDF(){
  if(window.jspdf)return true;
  return new Promise((resolve)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload=()=>resolve(true);
    s.onerror=()=>{showSnack(pref.lang==='id'?'Gagal memuat library PDF. Periksa internet.':'Failed to load PDF library. Check internet.');resolve(false)};
    document.head.appendChild(s);
  });
}

async function exportTodayAgendaPDF(){
  if(!await loadJsPDF())return;
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const td=today();
  const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
  const tmr=`${tomorrow.getFullYear()}-${pad(tomorrow.getMonth()+1)}-${pad(tomorrow.getDate())}`;
  const todayTasks=(data.tasks||[]).filter(t=>t.dueDate===td).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  const tmrTasks=(data.tasks||[]).filter(t=>t.dueDate===tmr).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));

  let y=20;
  doc.setFontSize(18);doc.setFont('helvetica','bold');
  doc.text('Daily Agenda',105,y,{align:'center'});y+=10;
  doc.setFontSize(10);doc.setFont('helvetica','normal');
  doc.text(`Generated: ${new Date().toLocaleString()}`,105,y,{align:'center'});y+=14;

  function drawTasks(tasks,label,startY){
    let cy=startY;
    doc.setFontSize(14);doc.setFont('helvetica','bold');doc.setTextColor(10,61,12);
    doc.text(label,14,cy);cy+=8;
    if(!tasks.length){doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(100);doc.text('No tasks',14,cy);return cy+10;}
    doc.setFontSize(9);doc.setTextColor(0);
    // Header
    doc.setFont('helvetica','bold');doc.setFillColor(215,236,217);
    doc.rect(14,cy-4,182,7,'F');
    doc.text('#',16,cy);doc.text('Task',24,cy);doc.text('Time',100,cy);doc.text('Duration',120,cy);doc.text('PIC',145,cy);doc.text('Location',165,cy);cy+=8;
    doc.setFont('helvetica','normal');
    tasks.forEach((t,i)=>{
      if(cy>275){doc.addPage();cy=20;}
      const isDone=t.status==='done';
      doc.setTextColor(isDone?150:0);
      doc.text(String(i+1),16,cy);
      doc.text((t.title||'').slice(0,30),24,cy);
      doc.text(t.time||'-',100,cy);
      doc.text(t.duration?t.duration+'min':'-',120,cy);
      doc.text((t.pic||'-').slice(0,10),145,cy);
      doc.text((t.location||'-').slice(0,15),165,cy);
      cy+=6;
    });
    doc.setTextColor(0);
    return cy+6;
  }

  y=drawTasks(todayTasks,`Today — ${fmtDate(td)}`,y);
  y=drawTasks(tmrTasks,`Tomorrow — ${fmtDate(tmr)}`,y);

  doc.save(`Agenda_${td}.pdf`);
  showSnack(pref.lang==='id'?'PDF agenda berhasil diexport!':'Agenda PDF exported!');
}

async function exportSelfDevPDF(section){
  if(!await loadJsPDF())return;
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF();
  let y=20;

  doc.setFontSize(18);doc.setFont('helvetica','bold');
  const titles={notes:'Notes',links:'Bookmarks & Links',projects:'Projects',books:'Reading List',subjects:'Learning Progress'};
  doc.text(titles[section]||section,105,y,{align:'center'});y+=8;
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(100);
  doc.text(`Exported: ${new Date().toLocaleString()}`,105,y,{align:'center'});y+=12;
  doc.setTextColor(0);

  if(!data.selfDev)data.selfDev={};
  const items=data.selfDev[section]||[];

  if(section==='notes'){
    items.forEach((n,i)=>{
      if(y>260){doc.addPage();y=20;}
      doc.setFontSize(12);doc.setFont('helvetica','bold');
      doc.text(`${i+1}. ${n.title||'Untitled'}`,14,y);y+=6;
      doc.setFontSize(9);doc.setFont('helvetica','normal');
      const lines=doc.splitTextToSize(n.content||'',175);
      lines.forEach(line=>{if(y>280){doc.addPage();y=20;}doc.text(line,14,y);y+=4.5;});
      y+=6;doc.setDrawColor(200);doc.line(14,y,196,y);y+=6;
    });
  } else if(section==='links'){
    const cats=[...new Set(items.map(l=>l.category||'Uncategorized'))];
    cats.forEach(cat=>{
      if(y>265){doc.addPage();y=20;}
      doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(10,61,12);
      doc.text(cat,14,y);y+=7;doc.setTextColor(0);
      items.filter(l=>(l.category||'Uncategorized')===cat).forEach((l,i)=>{
        if(y>275){doc.addPage();y=20;}
        doc.setFontSize(10);doc.setFont('helvetica','bold');
        doc.text(`${l.name} ${'★'.repeat(l.stars||0)}${'☆'.repeat(5-(l.stars||0))}`,14,y);y+=5;
        doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(50,100,200);
        doc.text(l.url||'',14,y);y+=4;doc.setTextColor(100);
        if(l.desc){doc.text(l.desc,14,y);y+=4;}
        doc.setTextColor(0);y+=3;
      });
      y+=3;
    });
  } else if(section==='books'){
    doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setFillColor(215,236,217);
    doc.rect(14,y-4,182,7,'F');
    doc.text('#',16,y);doc.text('Title',24,y);doc.text('Author',100,y);doc.text('Progress',150,y);y+=8;
    doc.setFont('helvetica','normal');
    items.forEach((b,i)=>{
      if(y>280){doc.addPage();y=20;}
      const pct=b.totalPages?Math.round(b.currentPage/b.totalPages*100):0;
      doc.text(String(i+1),16,y);doc.text((b.title||'').slice(0,35),24,y);
      doc.text((b.author||'-').slice(0,25),100,y);doc.text(`${b.currentPage||0}/${b.totalPages||0} (${pct}%)`,150,y);y+=6;
    });
  } else if(section==='subjects'){
    doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setFillColor(215,236,217);
    doc.rect(14,y-4,182,7,'F');
    doc.text('#',16,y);doc.text('Subject',24,y);doc.text('Source',100,y);doc.text('Progress',160,y);y+=8;
    doc.setFont('helvetica','normal');
    items.forEach((s,i)=>{
      if(y>280){doc.addPage();y=20;}
      doc.text(String(i+1),16,y);doc.text((s.name||'').slice(0,35),24,y);
      doc.text((s.source||'-').slice(0,30),100,y);doc.text(`${s.progress||0}%`,160,y);y+=6;
    });
  } else if(section==='projects'){
    items.forEach((p,i)=>{
      if(y>270){doc.addPage();y=20;}
      doc.setFontSize(11);doc.setFont('helvetica','bold');
      doc.text(`${i+1}. ${p.name}`,14,y);y+=5;
      doc.setFontSize(9);doc.setFont('helvetica','normal');
      doc.text(`Status: ${p.status||'planning'}`,14,y);y+=4;
      if(p.desc){const lines=doc.splitTextToSize(p.desc,175);lines.forEach(l=>{doc.text(l,14,y);y+=4;});}
      y+=4;doc.setDrawColor(200);doc.line(14,y,196,y);y+=4;
    });
  }

  if(!items.length){doc.setFontSize(11);doc.text('No data available.',14,y);}

  doc.save(`LifeOS_${section}_${today()}.pdf`);
  showSnack(pref.lang==='id'?'PDF berhasil diexport!':'PDF exported!');
}
